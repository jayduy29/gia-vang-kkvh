name: Cập nhật giá vàng hằng ngày

on:
  schedule:
    # 03:00, 07:00, 09:00 UTC = 10:00, 14:00, 16:00 giờ Việt Nam hằng ngày
    - cron: '0 3 * * *'
    - cron: '0 7 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Tải thêm lịch sử từ Wayback Machine (1 năm)'
        type: boolean
        default: false
      max:
        description: 'Số snapshot Wayback tối đa'
        type: string
        default: '400'

permissions:
  contents: write

# tránh 2 lần chạy đè lên nhau
concurrency:
  group: gold-price-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Thu thập giá vàng
        run: |
          EXTRA=""
          if [ "${{ inputs.backfill }}" = "true" ]; then
            EXTRA="--backfill --max=${{ inputs.max }}"
          fi
          node scripts/fetch-gold.mjs $EXTRA

      - name: Commit data/gold.json
        run: |
          git config user.name "gold-price-bot"
          git config user.email "41898642+github-actions[bot]@users.noreply.github.com"
          git add data/gold.json
          if git diff --cached --quiet; then
            echo "Không có thay đổi — site chưa cập nhật giá mới."
          else
            git commit -m "data: cập nhật giá vàng $(date -u +%Y-%m-%d)"
            git push
          fi
